AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  serverless-url-shortener-aws — Part II, bai 04: them bang DynamoDB single-table.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 128
    Timeout: 5
    Tracing: Active  # bat X-Ray cho moi function

Resources:
  # Custom event bus: tach su kien cua ung dung khoi default bus (cua AWS services).
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: url-shortener-events

  # Single-table: moi entity (link, stat...) song chung mot bang, phan biet bang
  # tien to trong PK/SK. PK = phan vung, SK = sap xep trong phan vung.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: url-shortener
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # GSI1: tra cuu nguoc theo nguoi dung. Chi item co GSI1PK/GSI1SK moi vao
      # index (sparse) -> chi link META vao day, STAT bi loai tu nhien.
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # Marker idempotency (CLICK#<eventId>) tu xoa sau khi het han nho TTL.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: url-shortener-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: url-shortener-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
      # JWT authorizer cho Cognito. KHONG dat DefaultAuthorizer de GET /{code}
      # van public; chi gan authorizer cho route can bao ve.
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  CreateLinkFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/create-link.ts
    Properties:
      CodeUri: src
      Handler: handlers/create-link.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /links
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  ResolveLinkFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/resolve-link.ts
    Properties:
      CodeUri: src
      Handler: handlers/resolve-link.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          EVENT_BUS: !Ref EventBus
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        Resolve:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{code}
            Method: GET

  ListLinksFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/list-links.ts
    Properties:
      CodeUri: src
      Handler: handlers/list-links.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /links
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteLinkFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/delete-link.ts
    Properties:
      CodeUri: src
      Handler: handlers/delete-link.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /links/{code}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  # DLQ: su kien xu ly that bai qua maxReceiveCount lan se roi vao day.
  ClickDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: url-shortener-clicks-dlq
      MessageRetentionPeriod: 1209600  # 14 ngay

  # Hang doi dem giua EventBridge va aggregator. Cho phep batch + retry + DLQ.
  ClickQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: url-shortener-clicks
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ClickDLQ.Arn
        maxReceiveCount: 3

  # Cho phep EventBridge gui message vao ClickQueue (chi tu rule cua ta).
  ClickQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ClickQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ClickQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ClickRule.Arn

  # Rule tren custom bus: khop link.clicked -> day sang ClickQueue.
  ClickRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - urlshortener
        detail-type:
          - link.clicked
      Targets:
        - Id: ClickQueueTarget
          Arn: !GetAtt ClickQueue.Arn

  # Aggregator that: dem click idempotent + partial batch failure.
  ClickAggregatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/click-aggregator.ts
    Properties:
      CodeUri: src
      Handler: handlers/click-aggregator.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          WS_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt ClickQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---- Step Functions: kiem duyet link ----
  ModerateCheckFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/moderate-check.ts
    Properties:
      CodeUri: src
      Handler: handlers/moderate-check.handler

  LinkModerationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/moderation.asl.json
      DefinitionSubstitutions:
        ModerateCheckArn: !GetAtt ModerateCheckFunction.Arn
        TableName: !Ref Table
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ModerateCheckFunction
        - DynamoDBCrudPolicy:
            TableName: !Ref Table

  # ---- WebSocket API (realtime push) ----
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: url-shortener-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WsConnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/ws-connect.ts
    Properties:
      CodeUri: src
      Handler: handlers/ws-connect.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table

  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - handlers/ws-disconnect.ts
    Properties:
      CodeUri: src
      Handler: handlers/ws-disconnect.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table

  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${ConnectIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${DisconnectIntegration}"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

Outputs:
  ModerationStateMachineArn:
    Value: !Ref LinkModerationStateMachine
  WebSocketUrl:
    Description: "URL WebSocket (them ?code=<code> khi ket noi)"
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  ApiUrl:
    Description: "URL goc cua HTTP API ($default stage)"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
